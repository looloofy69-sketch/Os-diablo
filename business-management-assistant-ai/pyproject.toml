[project]
name = "business-management-assistant-ai"
version = "0.4.1"
description = "Clean-slate AI operating system for a new business"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlmodel>=0.0.22,<1",
  "pydantic-settings>=2.6,<3",
  "alembic>=1.13,<2",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]
local-models = [
  "huggingface_hub>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["app*"]
