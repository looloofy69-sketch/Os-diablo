name: Documentation and issue-map integrity

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/**"
      - "scripts/check_backlog_sync.py"
      - ".github/workflows/docs-integrity.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/check_backlog_sync.py"
      - ".github/workflows/docs-integrity.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  docs-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify backlog and issue-map consistency
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/check_backlog_sync.py
