name: Defect or risk report
description: Report a reproducible defect, unsafe behavior, or evidence gap
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Report type
      options:
        - Runtime defect
        - Security risk
        - Data integrity
        - Integration failure
        - Test or release failure
        - Documentation mismatch
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: State facts separately from assumptions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and environment
      description: Include commit SHA, versions, safe steps and sanitized configuration.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and impact
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and evidence
      description: Redact tokens, customer content, private URLs and other secrets. Do not publish exploit details.
    validations:
      required: false
